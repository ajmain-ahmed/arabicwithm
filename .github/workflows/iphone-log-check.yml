name: Read-only iPhone startup edge check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/iphone-log-check.yml
      - scripts/diagnose-cloudflare-startup.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read startup edge evidence (safe aggregates only)
        run: node scripts/diagnose-cloudflare-startup.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
