name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/learn-worker-check.yml
      - scripts/diagnose-learn-worker.mjs
      - .github/workflows/production-learn-verification.yml
  workflow_dispatch:

# Serialize deploys so two pushes cannot interleave uploads.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate types, source lint, and unit tests
        run: |
          npm run typecheck
          npm run lint -- --quiet
          npm run test:ci

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Verify critical browser journeys
        run: npx playwright test e2e/auth-session.pw.ts e2e/book-actions-quality.pw.ts e2e/watch-navigation.pw.ts e2e/library-discovery.pw.ts --grep 'registration hand-off|matching book actions|Watch, Show, Episode|mobile library renders|desktop navigation omits'

      - name: Verify Admin incomplete-Book reader access
        run: npx playwright test e2e/admin-chapter-visibility.pw.ts
        env:
          AWM_TEST_CHAPTER_PUBLICATION: '1'

      - name: Verify Admin reader on legacy publication schema
        run: npx playwright test e2e/admin-chapter-visibility.pw.ts
        env:
          AWM_TEST_CHAPTER_PUBLICATION: '1'
          AWM_TEST_PUBLIC_VISIBILITY: '1'

      - name: Verify independent continuous Learn activities
        run: npx playwright test e2e/learn-continuity.pw.ts e2e/learn-matching.pw.ts --grep '390px|matching'
        env:
          AWM_TEST_LEARN_CONTINUITY: '1'

      - name: Verify English-source subtitle layout and playback
        run: npx playwright test --config=playwright.english-subtitles.config.ts --project=chromium-ci

      # vinext-cloudflare deploy validates, builds, and deploys the
      # arabicwithm Worker. NEXT_PUBLIC_* values are inlined into the client
      # bundle at build time; all server secrets live as Worker secrets and
      # are not needed here.
      - name: Build and deploy Worker
        id: worker
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Verify continuous practice on production
        run: npx playwright test --config=playwright.learn.config.ts --project=chromium-ci --grep '390px'
        env:
          AWM_LEARN_BASE_URL: https://www.arabicwithm.com

      - name: Inspect current-deployment Learn resource evidence
        if: ${{ always() && steps.worker.outcome == 'success' }}
        run: node scripts/diagnose-learn-worker.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
