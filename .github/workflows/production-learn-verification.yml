name: Verify production Learn browsers
on:
  push:
    branches: [main]
    paths: [.github/workflows/production-learn-verification.yml]
  workflow_run:
    workflows: [Deploy to Cloudflare Workers]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-learn-browser-verification
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install public browser engines
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright install chrome msedge
      - name: Verify public production continuous practice in four browsers
        run: npx playwright test --config=playwright.learn.config.ts --project=chrome --project=webkit --project=firefox --project=edge --grep 'continuous independent Learn'
        env:
          AWM_LEARN_BASE_URL: https://www.arabicwithm.com
      - name: Capture current-deployment resource outcomes
        if: always()
        run: node scripts/diagnose-learn-worker.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-learn-browser-evidence
          path: test-results/
          if-no-files-found: ignore
