<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g fill="none" stroke="currentColor" stroke-width="1">
    <!-- Concentric circles -->
    <circle cx="100" cy="100" r="90" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="75"/>
    <circle cx="100" cy="100" r="60"/>
    <circle cx="100" cy="100" r="45"/>
    <circle cx="100" cy="100" r="30"/>
    <circle cx="100" cy="100" r="15" fill="currentColor"/>

    <!-- 16-pointed star from center -->
    <g stroke-width="1">
      <line x1="100" y1="10" x2="100" y2="190"/>
      <line x1="10" y1="100" x2="190" y2="100"/>
      <line x1="36" y1="36" x2="164" y2="164"/>
      <line x1="164" y1="36" x2="36" y2="164"/>
      <line x1="100" y1="25" x2="100" y2="175" transform="rotate(22.5 100 100)"/>
      <line x1="25" y1="100" x2="175" y2="100" transform="rotate(22.5 100 100)"/>
      <line x1="100" y1="25" x2="100" y2="175" transform="rotate(67.5 100 100)"/>
      <line x1="25" y1="100" x2="175" y2="100" transform="rotate(67.5 100 100)"/>
    </g>

    <!-- Petal shapes at outer ring -->
    <g stroke-width="1.2">
      <ellipse cx="100" cy="30" rx="12" ry="20"/>
      <ellipse cx="170" cy="100" rx="20" ry="12"/>
      <ellipse cx="100" cy="170" rx="12" ry="20"/>
      <ellipse cx="30" cy="100" rx="20" ry="12"/>
      <ellipse cx="151" cy="49" rx="14" ry="14" transform="rotate(45 151 49)"/>
      <ellipse cx="151" cy="151" rx="14" ry="14" transform="rotate(45 151 151)"/>
      <ellipse cx="49" cy="151" rx="14" ry="14" transform="rotate(45 49 151)"/>
      <ellipse cx="49" cy="49" rx="14" ry="14" transform="rotate(45 49 49)"/>
    </g>

    <!-- Small decorative dots -->
    <g fill="currentColor">
      <circle cx="100" cy="10" r="3"/>
      <circle cx="190" cy="100" r="3"/>
      <circle cx="100" cy="190" r="3"/>
      <circle cx="10" cy="100" r="3"/>
      <circle cx="36" cy="36" r="3"/>
      <circle cx="164" cy="36" r="3"/>
      <circle cx="164" cy="164" r="3"/>
      <circle cx="36" cy="164" r="3"/>
    </g>
  </g>
</svg>