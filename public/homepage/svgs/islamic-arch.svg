<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#archGrad)" stroke-width="3">
    <!-- Outer arch frame -->
    <path d="M 20 250 L 20 100 Q 20 20 100 10 Q 180 20 180 100 L 180 250" 
      stroke-width="6" stroke-linecap="round"/>
    <!-- Inner arch frame -->
    <path d="M 35 250 L 35 110 Q 35 40 100 28 Q 165 40 165 110 L 165 250" 
      stroke-width="3"/>
    <!-- Decorative keystone at apex -->
    <polygon points="100,5 108,20 100,28 92,20" fill="#d4a843" stroke="none"/>
    <!-- Inner geometric pattern lines within arch -->
    <g stroke-width="1.5" opacity="0.7">
      <path d="M 50 250 L 50 130 Q 50 60 100 35"/>
      <path d="M 150 250 L 150 130 Q 150 60 100 35"/>
      <!-- Horizontal bands -->
      <line x1="38" y1="80" x2="162" y2="80"/>
      <line x1="38" y1="120" x2="162" y2="120"/>
      <line x1="38" y1="160" x2="162" y2="160"/>
      <line x1="38" y1="200" x2="162" y2="200"/>
    </g>
    <!-- Small decorative diamonds on outer frame -->
    <g fill="#d4a843" stroke="none">
      <polygon points="20,70 24,78 20,86 16,78"/>
      <polygon points="180,70 184,78 180,86 176,78"/>
      <polygon points="20,140 24,148 20,156 16,148"/>
      <polygon points="180,140 184,148 180,156 176,148"/>
      <polygon points="20,210 24,218 20,226 16,218"/>
      <polygon points="180,210 184,218 180,226 176,218"/>
    </g>
  </g>
</svg>