<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 280" width="160" height="280">
  <defs>
    <linearGradient id="lanternGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="50%" style="stop-color:#b8860b"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#lanternGrad)" stroke-width="2">
    <!-- Hanging chain/ring -->
    <circle cx="80" cy="12" r="6"/>
    <line x1="80" y1="18" x2="80" y2="35"/>

    <!-- Top dome -->
    <path d="M 50 80 Q 50 45, 80 35 Q 110 45, 110 80" 
      fill="url(#lanternGrad)" opacity="0.2"/>
    <!-- Dome decorative lines -->
    <path d="M 60 70 Q 60 50, 80 42 Q 100 50, 100 70" stroke-width="1.5"/>
    <line x1="80" y1="35" x2="80" y2="55" stroke-width="1"/>
    <line x1="65" y1="60" x2="95" y2="60" stroke-width="1"/>

    <!-- Top rim -->
    <ellipse cx="80" cy="80" rx="35" ry="6" fill="url(#lanternGrad)" opacity="0.15"/>

    <!-- Main body - hexagonal prism -->
    <path d="M 45 85 L 115 85 L 115 180 L 45 180 Z" 
      fill="url(#lanternGrad)" opacity="0.1"/>

    <!-- Vertical frame lines -->
    <line x1="58" y1="85" x2="58" y2="180"/>
    <line x1="80" y1="85" x2="80" y2="180"/>
    <line x1="102" y1="85" x2="102" y2="180"/>

    <!-- Horizontal decorative bands -->
    <line x1="45" y1="100" x2="115" y2="100" stroke-width="1.5"/>
    <line x1="45" y1="130" x2="115" y2="130" stroke-width="1.5"/>
    <line x1="45" y1="160" x2="115" y2="160" stroke-width="1.5"/>

    <!-- Geometric cutout patterns on panels -->
    <g stroke-width="1.2" opacity="0.8">
      <!-- Left panel pattern -->
      <polygon points="51,110 65,110 58,122"/>
      <polygon points="51,140 65,140 58,152"/>
      <!-- Center panel pattern -->
      <polygon points="68,108 80,95 92,108 92,122 80,135 68,122"/>
      <circle cx="80" cy="132" r="8"/>
      <!-- Right panel pattern -->
      <polygon points="95,110 109,110 102,122"/>
      <polygon points="95,140 109,140 102,152"/>
    </g>

    <!-- Inner candle glow -->
    <ellipse cx="80" cy="150" rx="20" ry="25" fill="#d4a843" opacity="0.15" stroke="none"/>
    <polygon points="80,145 82,155 80,158 78,155" fill="#d4a843" opacity="0.6" stroke="none"/>

    <!-- Bottom rim -->
    <ellipse cx="80" cy="180" rx="35" ry="6" fill="url(#lanternGrad)" opacity="0.15"/>

    <!-- Bottom finial -->
    <path d="M 70 185 Q 70 210, 80 225 Q 90 210, 90 185"/>
    <circle cx="80" cy="230" r="4" fill="url(#lanternGrad)"/>
    <circle cx="80" cy="240" r="3" fill="url(#lanternGrad)" opacity="0.7"/>
    <circle cx="80" cy="248" r="2" fill="url(#lanternGrad)" opacity="0.5"/>
  </g>
</svg>