<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#domeGrad)" stroke-width="2">
    <!-- Crescent finial -->
    <circle cx="100" cy="12" r="4" fill="#d4a843"/>
    <rect x="98" y="16" width="4" height="8" fill="#d4a843"/>

    <!-- Main dome bulb -->
    <path d="M 30 120 Q 30 40, 100 24 Q 170 40, 170 120" 
      fill="url(#domeGrad)" opacity="0.15" stroke-width="2.5"/>

    <!-- Dome ribs/segments (vertical lines) -->
    <path d="M 100 24 Q 100 72, 100 120" stroke-width="1" opacity="0.6"/>
    <path d="M 65 32 Q 70 76, 75 120" stroke-width="1" opacity="0.5"/>
    <path d="M 135 32 Q 130 76, 125 120" stroke-width="1" opacity="0.5"/>
    <path d="M 42 55 Q 55 88, 62 120" stroke-width="0.8" opacity="0.4"/>
    <path d="M 158 55 Q 145 88, 138 120" stroke-width="0.8" opacity="0.4"/>

    <!-- Horizontal decorative bands on dome -->
    <path d="M 38 70 Q 100 55, 162 70" stroke-width="1" opacity="0.6"/>
    <path d="M 32 95 Q 100 80, 168 95" stroke-width="1" opacity="0.6"/>

    <!-- Drum (base of dome) -->
    <rect x="25" y="118" width="150" height="18" rx="2" 
      fill="url(#domeGrad)" opacity="0.1" stroke-width="2"/>

    <!-- Drum decorative pattern -->
    <g stroke-width="1">
      <rect x="35" y="122" width="8" height="10" rx="1" opacity="0.5"/>
      <rect x="55" y="122" width="8" height="10" rx="1" opacity="0.5"/>
      <rect x="75" y="122" width="8" height="10" rx="1" opacity="0.5"/>
      <rect x="95" y="122" width="8" height="10" rx="1" opacity="0.5"/>
      <rect x="115" y="122" width="8" height="10" rx="1" opacity="0.5"/>
      <rect x="135" y="122" width="8" height="10" rx="1" opacity="0.5"/>
      <rect x="155" y="122" width="8" height="10" rx="1" opacity="0.5"/>
    </g>

    <!-- Base molding -->
    <rect x="18" y="136" width="164" height="8" rx="1" 
      fill="url(#domeGrad)" opacity="0.2"/>
    <rect x="12" y="144" width="176" height="6" rx="1" 
      fill="url(#domeGrad)" opacity="0.15"/>
  </g>
</svg>