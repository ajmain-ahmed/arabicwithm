<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 40" width="600" height="40">
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <!-- Center diamond -->
    <g fill="currentColor">
      <polygon points="300,5 308,20 300,35 292,20"/>
      <circle cx="300" cy="20" r="3"/>
    </g>
    <!-- Left side pattern -->
    <g stroke-width="1">
      <!-- Scrolling vine-like lines -->
      <path d="M 20 20 Q 40 8, 60 20 T 100 20" opacity="0.6"/>
      <path d="M 20 20 Q 40 32, 60 20 T 100 20" opacity="0.6"/>

      <!-- Small decorative elements -->
      <circle cx="80" cy="20" r="3" fill="currentColor" opacity="0.5"/>
      <polygon points="130,14 136,20 130,26 124,20" fill="currentColor" opacity="0.4"/>
      <polygon points="170,14 176,20 170,26 164,20" fill="currentColor" opacity="0.4"/>

      <!-- Connecting line to center -->
      <line x1="10" y1="20" x2="292" y2="20" stroke-dasharray="4,3" opacity="0.5"/>
    </g>
    <!-- Right side pattern (mirror of left) -->
    <g stroke-width="1">
      <path d="M 580 20 Q 560 8, 540 20 T 500 20" opacity="0.6"/>
      <path d="M 580 20 Q 560 32, 540 20 T 500 20" opacity="0.6"/>

      <circle cx="520" cy="20" r="3" fill="currentColor" opacity="0.5"/>
      <polygon points="470,14 476,20 470,26 464,20" fill="currentColor" opacity="0.4"/>
      <polygon points="430,14 436,20 430,26 424,20" fill="currentColor" opacity="0.4"/>

      <line x1="590" y1="20" x2="308" y2="20" stroke-dasharray="4,3" opacity="0.5"/>
    </g>
  </g>
</svg>