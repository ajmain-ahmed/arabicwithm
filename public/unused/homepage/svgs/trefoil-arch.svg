<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <g fill="none" stroke="url(#trefoilGrad)" stroke-width="2">
    <defs>
      <linearGradient id="trefoilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#d4a843"/>
        <stop offset="100%" style="stop-color:#b8860b"/>
      </linearGradient>
    </defs>
    <!-- Outer trefoil arch frame -->
    <path d="M 20 170 L 20 80 
             Q 20 20, 60 50 
             Q 100 10, 140 50 
             Q 180 20, 180 80 
             L 180 170" 
      stroke-width="3" stroke-linecap="round"/>

    <!-- Inner trefoil -->
    <path d="M 35 170 L 35 95 
             Q 35 50, 60 70 
             Q 100 40, 140 70 
             Q 165 50, 165 95 
             L 165 170" 
      stroke-width="2"/>

    <!-- Three inner lobes detail -->
    <path d="M 60 50 Q 60 30, 75 40 Q 85 50, 80 65" stroke-width="1.2" opacity="0.7"/>
    <path d="M 140 50 Q 140 30, 125 40 Q 115 50, 120 65" stroke-width="1.2" opacity="0.7"/>
    <path d="M 100 35 Q 100 20, 110 28 Q 118 35, 110 48" stroke-width="1.2" opacity="0.7"/>

    <!-- Vertical dividing lines -->
    <line x1="100" y1="48" x2="100" y2="170" stroke-width="1"/>
    <line x1="60" y1="65" x2="60" y2="170" stroke-width="1" opacity="0.6"/>
    <line x1="140" y1="65" x2="140" y2="170" stroke-width="1" opacity="0.6"/>

    <!-- Horizontal decorative bands -->
    <line x1="35" y1="110" x2="165" y2="110" stroke-width="1" opacity="0.5"/>
    <line x1="35" y1="140" x2="165" y2="140" stroke-width="1" opacity="0.5"/>

    <!-- Small decorative elements at lobe intersections -->
    <g fill="#d4a843" stroke="none" opacity="0.6">
      <circle cx="100" cy="48" r="3"/>
      <circle cx="60" cy="65" r="2.5"/>
      <circle cx="140" cy="65" r="2.5"/>
    </g>

    <!-- Bottom base line with pattern -->
    <rect x="15" y="168" width="170" height="6" rx="2" fill="url(#trefoilGrad)" opacity="0.2"/>
  </g>
</svg>