<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <g id="tile-unit">
      <!-- Small 8-pointed star -->
      <polygon points="40,5 47,18 60,25 47,32 40,45 33,32 20,25 33,18" 
        fill="none" stroke="currentColor" stroke-width="1"/>
      <!-- Inner diamond -->
      <polygon points="40,18 47,25 40,32 33,25" 
        fill="currentColor" opacity="0.2"/>
      <!-- Connecting lines to adjacent tiles -->
      <circle cx="40" cy="0" r="1.5" fill="currentColor" opacity="0.3"/>
      <circle cx="80" cy="40" r="1.5" fill="currentColor" opacity="0.3"/>
      <circle cx="40" cy="80" r="1.5" fill="currentColor" opacity="0.3"/>
      <circle cx="0" cy="40" r="1.5" fill="currentColor" opacity="0.3"/>
      <!-- Corner accents -->
      <line x1="0" y1="0" x2="15" y2="15" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
      <line x1="80" y1="0" x2="65" y2="15" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
      <line x1="0" y1="80" x2="15" y2="65" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
      <line x1="80" y1="80" x2="65" y2="65" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
    </g>
  </defs>
  <g style="color:#b8860b; opacity:0.25">
    <use href="#tile-unit"/>
  </g>
</svg>