<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#frameGrad)" stroke-width="2">
    <!-- Outer frame -->
    <rect x="10" y="10" width="380" height="280" rx="4" stroke-width="3"/>
    <rect x="20" y="20" width="360" height="260" rx="2" stroke-width="1.5"/>

    <!-- Corner ornaments -->
    <g stroke-width="1.5">
      <!-- Top-left corner -->
      <path d="M 10 40 Q 10 10, 40 10"/>
      <path d="M 10 55 Q 10 55, 25 55 L 55 25 Q 55 10, 55 10"/>
      <polygon points="35,10 40,18 35,26 30,18" fill="#d4a843" opacity="0.5"/>

      <!-- Top-right corner -->
      <path d="M 360 10 Q 390 10, 390 40"/>
      <path d="M 375 10 Q 375 10, 375 25 L 345 55 Q 345 55, 345 55"/>
      <polygon points="365,10 370,18 365,26 360,18" fill="#d4a843" opacity="0.5"/>

      <!-- Bottom-left corner -->
      <path d="M 10 260 Q 10 290, 40 290"/>
      <path d="M 55 290 Q 55 290, 55 275 L 25 245"/>
      <polygon points="35,290 40,282 35,274 30,282" fill="#d4a843" opacity="0.5"/>

      <!-- Bottom-right corner -->
      <path d="M 360 290 Q 390 290, 390 260"/>
      <path d="M 345 290 Q 345 290, 345 275 L 375 245"/>
      <polygon points="365,290 370,282 365,274 360,282" fill="#d4a843" opacity="0.5"/>
    </g>

    <!-- Side decorative elements -->
    <g stroke-width="1" opacity="0.6">
      <!-- Top center -->
      <polygon points="200,10 205,16 200,22 195,16" fill="#d4a843" opacity="0.5"/>
      <!-- Bottom center -->
      <polygon points="200,290 205,284 200,278 195,284" fill="#d4a843" opacity="0.5"/>
      <!-- Left center -->
      <polygon points="10,150 16,155 22,150 16,145" fill="#d4a843" opacity="0.5"/>
      <!-- Right center -->
      <polygon points="390,150 384,155 378,150 384,145" fill="#d4a843" opacity="0.5"/>
    </g>

    <!-- Inner dashed accent lines -->
    <line x1="60" y1="10" x2="190" y2="10" stroke-dasharray="4,3" opacity="0.4"/>
    <line x1="210" y1="10" x2="340" y2="10" stroke-dasharray="4,3" opacity="0.4"/>
    <line x1="60" y1="290" x2="190" y2="290" stroke-dasharray="4,3" opacity="0.4"/>
    <line x1="210" y1="290" x2="340" y2="290" stroke-dasharray="4,3" opacity="0.4"/>
  </g>
</svg>