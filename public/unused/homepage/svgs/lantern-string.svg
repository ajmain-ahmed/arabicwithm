<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <g id="hanging-lantern-mini">
      <!-- Chain -->
      <line x1="0" y1="-30" x2="0" y2="0" stroke="#b8860b" stroke-width="1.5"/>
      <!-- Lantern body -->
      <path d="M -12 0 L 12 0 L 10 25 L -10 25 Z" 
        fill="none" stroke="#d4a843" stroke-width="1.5"/>
      <!-- Lantern glow -->
      <ellipse cx="0" cy="14" rx="5" ry="8" fill="#d4a843" opacity="0.2"/>
      <!-- Bottom point -->
      <circle cx="0" cy="28" r="2" fill="#d4a843"/>
    </g>
  </defs>

  <!-- Curved string/wire -->
  <path d="M 10 10 Q 100 45, 200 20 Q 300 -5, 390 25" 
    fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.6"/>

  <!-- Lanterns hanging at different heights -->
  <g opacity="0.85">
    <use href="#hanging-lantern-mini" x="50" y="35"/>
    <use href="#hanging-lantern-mini" x="120" y="50"/>
    <use href="#hanging-lantern-mini" x="200" y="28"/>
    <use href="#hanging-lantern-mini" x="280" y="20"/>
    <use href="#hanging-lantern-mini" x="350" y="42"/>
  </g>

  <!-- Small sparkle dots -->
  <g fill="#d4a843" opacity="0.4">
    <circle cx="80" cy="25" r="1.5"/>
    <circle cx="160" cy="15" r="1"/>
    <circle cx="240" cy="35" r="1.5"/>
    <circle cx="320" cy="20" r="1"/>
  </g>
</svg>