<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" width="100" height="50">
  <defs>
    <g id="border-unit">
      <!-- Small square khatam -->
      <rect x="5" y="5" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
      <line x1="5" y1="5" x2="45" y2="45" stroke="currentColor" stroke-width="0.8"/>
      <line x1="45" y1="5" x2="5" y2="45" stroke="currentColor" stroke-width="0.8"/>
      <rect x="15" y="15" width="20" height="20" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <!-- Small center diamond -->
      <polygon points="25,18 32,25 25,32 18,25" fill="currentColor" opacity="0.5"/>
      <!-- Connecting lines to next unit -->
      <line x1="45" y1="25" x2="55" y2="25" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2"/>
      <!-- Top/bottom decorative dots -->
      <circle cx="25" cy="2" r="1.5" fill="currentColor" opacity="0.4"/>
      <circle cx="25" cy="48" r="1.5" fill="currentColor" opacity="0.4"/>
    </g>
  </defs>
  <use href="#border-unit" style="color:#b8860b"/>
  <use href="#border-unit" x="50" style="color:#b8860b"/>
</svg>