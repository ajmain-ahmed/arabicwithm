<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="mihrabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#mihrabGrad)" stroke-width="2.5" stroke-linecap="round">
    <!-- Outer mihrab shape -->
    <path d="M 20 270 L 20 100 Q 20 50, 55 35 Q 100 5, 145 35 Q 180 50, 180 100 L 180 270" 
      stroke-width="4"/>
    <!-- Inner frame -->
    <path d="M 32 270 L 32 110 Q 32 65, 60 50 Q 100 22, 140 50 Q 168 65, 168 110 L 168 270" 
      stroke-width="2"/>
    <!-- Inner decorative arch -->
    <path d="M 44 270 L 44 120 Q 44 80, 68 65 Q 100 42, 132 65 Q 156 80, 156 120 L 156 270" 
      stroke-width="1.5" opacity="0.8"/>

    <!-- Geometric pattern bands inside -->
    <g stroke-width="1" opacity="0.6">
      <line x1="44" y1="140" x2="156" y2="140"/>
      <line x1="44" y1="165" x2="156" y2="165"/>
      <line x1="44" y1="190" x2="156" y2="190"/>
      <line x1="44" y1="215" x2="156" y2="215"/>
      <line x1="44" y1="240" x2="156" y2="240"/>
    </g>

    <!-- Central vertical accent -->
    <line x1="100" y1="42" x2="100" y2="270" stroke-width="1" opacity="0.4"/>

    <!-- Decorative diamonds on outer frame -->
    <g fill="#d4a843" stroke="none" opacity="0.5">
      <polygon points="20,80 25,90 20,100 15,90"/>
      <polygon points="180,80 185,90 180,100 175,90"/>
      <polygon points="20,130 25,140 20,150 15,140"/>
      <polygon points="180,130 185,140 180,150 175,140"/>
      <polygon points="20,180 25,190 20,200 15,190"/>
      <polygon points="180,180 185,190 180,200 175,190"/>
      <polygon points="20,230 25,240 20,250 15,240"/>
      <polygon points="180,230 185,240 180,250 175,240"/>
    </g>

    <!-- Apex finial -->
    <circle cx="100" cy="18" r="4" fill="#d4a843"/>
    <polygon points="100,8 102,13 100,16 98,13" fill="#d4a843"/>
  </g>
</svg>