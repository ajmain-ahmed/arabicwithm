<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <g id="star-unit">
      <!-- Outer octagon frame -->
      <polygon points="100,0 170,30 200,100 170,170 100,200 30,170 0,100 30,30" 
        fill="none" stroke="currentColor" stroke-width="1.5"/>
      <!-- Inner octagon -->
      <polygon points="100,30 155,55 170,100 155,145 100,170 45,145 30,100 45,55" 
        fill="none" stroke="currentColor" stroke-width="1"/>
      <!-- Cross lines -->
      <line x1="100" y1="0" x2="100" y2="200" stroke="currentColor" stroke-width="1"/>
      <line x1="0" y1="100" x2="200" y2="100" stroke="currentColor" stroke-width="1"/>
      <line x1="30" y1="30" x2="170" y2="170" stroke="currentColor" stroke-width="1"/>
      <line x1="170" y1="30" x2="30" y2="170" stroke="currentColor" stroke-width="1"/>
      <!-- 8-pointed star -->
      <polygon points="100,30 115,85 170,100 115,115 100,170 85,115 30,100 85,85" 
        fill="none" stroke="currentColor" stroke-width="1.5"/>
      <!-- Inner square -->
      <polygon points="100,60 140,100 100,140 60,100" 
        fill="none" stroke="currentColor" stroke-width="1"/>
      <!-- Center diamond -->
      <polygon points="100,75 125,100 100,125 75,100" 
        fill="none" stroke="currentColor" stroke-width="1"/>
      <!-- Corner diamonds -->
      <polygon points="100,0 108,22 100,30 92,22" fill="currentColor" opacity="0.6"/>
      <polygon points="200,100 178,108 170,100 178,92" fill="currentColor" opacity="0.6"/>
      <polygon points="100,200 92,178 100,170 108,178" fill="currentColor" opacity="0.6"/>
      <polygon points="0,100 22,92 30,100 22,108" fill="currentColor" opacity="0.6"/>
      <!-- Center dot -->
      <circle cx="100" cy="100" r="4" fill="currentColor"/>
    </g>
  </defs>
  <use href="#star-unit" style="color:#b8860b"/>
</svg>